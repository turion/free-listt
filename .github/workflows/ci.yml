on: [pull_request]
name: build
jobs:
  lint:
    name: "Run hlint"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up HLint
      uses: haskell-actions/hlint-setup@v2

    - name: Run HLint
      uses: haskell-actions/hlint-run@v2
      with:
        fail-on: warning

  fourmolu:
    name: "Run fourmolu"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/run-fourmolu@v13
      with:
        version: "0.11.0.0"

  cabal-check:
    name: "Cabal check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/setup@v2.12.0
    - name: Cabal check
      run: cabal check

  generateMatrix:
    name: "Generate matrix from cabal"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout base repo
        uses: actions/checkout@v7
      - name: Extract the tested GHC versions
        id: set-matrix
        run: |
          wget https://github.com/Kleidukos/get-tested/releases/download/v0.1.5.0/get-tested-0.1.5.0-linux-amd64 -O get-tested
          chmod +x get-tested
          ./get-tested --ubuntu free-listt.cabal >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: generateMatrix
    strategy:
      matrix: ${{ fromJSON(needs.generateMatrix.outputs.matrix) }}
    name: Haskell GHC ${{ matrix.ghc }} cabal
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2.12.0
        id: setup-haskell-build
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Cache Cabal build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup-haskell-build.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ matrix.ghc }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ matrix.ghc }}
      - name: Cabal build dependencies
        run: |
          cabal build all  --enable-tests --only-dependencies
      - name: Cabal build packages
        run: |
          cabal build all --enable-tests -fdev
      - name: Cabal test
        run: |
          cabal test all --enable-tests --test-show-details=Always -fdev

  success:
    name: All GHCs built successfully
    # Every job defined above must be listed here: `success` is the one check
    # required by branch protection, and it can only fail for a job that this
    # list names. A bare `needs:` list is not enough either — GitHub *skips* a
    # job whose dependency failed, and branch protection counts a skipped
    # required check as passing, so the gate would go green on a red build.
    # `if: always()` plus `alls-green` is what prevents that: the action's
    # default policy accepts only `success` for every job handed to it.
    # Do not change `always()` to `!cancelled()` — a cancelled dependency
    # would then skip this job, and a skipped required check reports Success.
    needs:
      - lint
      - fourmolu
      - cabal-check
      - generateMatrix
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency did not succeed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
